<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="470" viewBox="0 0 1320 470">
<title>Dating an LTR retrotransposon insertion from its two LTRs</title>
<defs><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.16"/></filter></defs>
<rect x="0" y="0" width="1320" height="470" fill="#FFFFFF"/>
<text x="20.0" y="34.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">a  At insertion (T = 0)</text>
<text x="20.0" y="54.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="start">both LTRs are copied from the same RNA region, so they start identical</text>
<rect x="50.0" y="91.0" width="28" height="16" fill="#BFBFBF"/>
<rect x="602.0" y="91.0" width="28" height="16" fill="#BFBFBF"/>
<text x="64.0" y="128.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B6B6B" text-anchor="middle">TSD</text>
<text x="616.0" y="128.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B6B6B" text-anchor="middle">TSD</text>
<polygon points="80.0,84.0 216.0,84.0 230.0,99.0 216.0,114.0 80.0,114.0" fill="#9ABFDA" stroke="#1F72AE" stroke-width="1"/>
<polygon points="450.0,84.0 586.0,84.0 600.0,99.0 586.0,114.0 450.0,114.0" fill="#9ABFDA" stroke="#1F72AE" stroke-width="1"/>
<rect x="234.0" y="90.0" width="212.0" height="18" fill="#FBCBA0" stroke="#F77E12" stroke-width="1"/>
<text x="340.0" y="104.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#000000" text-anchor="middle">internal region (gag, pol)</text>
<text x="155.0" y="76.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">5′ LTR</text>
<text x="525.0" y="76.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">3′ LTR</text>
<text x="20.0" y="184.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">b  After time T</text>
<text x="20.0" y="204.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="start">each LTR gains about rT neutral substitutions on its own (red marks)</text>
<rect x="50.0" y="241.0" width="28" height="16" fill="#BFBFBF"/>
<rect x="602.0" y="241.0" width="28" height="16" fill="#BFBFBF"/>
<text x="64.0" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B6B6B" text-anchor="middle">TSD</text>
<text x="616.0" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B6B6B" text-anchor="middle">TSD</text>
<polygon points="80.0,234.0 216.0,234.0 230.0,249.0 216.0,264.0 80.0,264.0" fill="#9ABFDA" stroke="#1F72AE" stroke-width="1"/>
<polygon points="450.0,234.0 586.0,234.0 600.0,249.0 586.0,264.0 450.0,264.0" fill="#9ABFDA" stroke="#1F72AE" stroke-width="1"/>
<rect x="234.0" y="240.0" width="212.0" height="18" fill="#FBCBA0" stroke="#F77E12" stroke-width="1"/>
<text x="340.0" y="254.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#000000" text-anchor="middle">internal region (gag, pol)</text>
<text x="155.0" y="226.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">5′ LTR</text>
<text x="525.0" y="226.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">3′ LTR</text>
<line x1="102.0" y1="236.0" x2="102.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="141.0" y1="236.0" x2="141.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="175.0" y1="236.0" x2="175.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="208.0" y1="236.0" x2="208.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="465.0" y1="236.0" x2="465.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="499.0" y1="236.0" x2="499.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="530.0" y1="236.0" x2="530.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="567.0" y1="236.0" x2="567.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<line x1="589.0" y1="236.0" x2="589.0" y2="262.0" stroke="#CC312C" stroke-width="2.4"/>
<rect x="680.0" y="20.0" width="620.0" height="250.0" rx="10" fill="#FFFFFF" stroke="#1F72AE" stroke-width="1.4" filter="url(#shadow)"/>
<text x="696.0" y="48.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">c  From divergence to age</text>
<text x="696" y="92" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#000000"><tspan font-style="italic">K</tspan> = 2<tspan font-style="italic">rT</tspan>   so   <tspan font-style="italic">T</tspan> = <tspan font-style="italic">K</tspan> / (2<tspan font-style="italic">r</tspan>)</text>
<text x="696.0" y="124.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#000000" text-anchor="start">K: substitutions per site between the two LTRs, corrected for multiple hits (Kimura 2-parameter, K2P)</text>
<text x="696.0" y="146.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#000000" text-anchor="start">r: neutral substitution rate per site per year; it sets the time scale</text>
<text x="696.0" y="178.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">Toy example (scripts/01_ltr_insertion_age.py, testdata/ltr_age.tsv):</text>
<text x="696.0" y="198.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#000000" text-anchor="start">200 sites, 10 differences: p-distance 0.050, K2P 0.0518; years: NA (no --rate given)</text>
<rect x="20.0" y="300.0" width="1280.0" height="140.0" rx="10" fill="#FCF6F6" stroke="#CC312C" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="36.0" y="326.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="start">Why one copy’s age is not a date</text>
<text x="50.0" y="352.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#000000" text-anchor="start">Rate choice: the script has no default rate; EDTA falls back to a rice rate of 1.3e-8 per bp per year if --u is not set, which must not be used for grape silently.</text>
<text x="50.0" y="376.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#000000" text-anchor="start">Gene conversion between the two LTRs erases differences and makes old copies look young; recombination with other copies can do the opposite.</text>
<text x="50.0" y="400.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#000000" text-anchor="start">Use the distribution over many intact copies of a family, not a single value (book chapter 6.1.1).</text>
<text x="1300.0" y="460.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B6B6B" text-anchor="end">Schematic. Formula and caveats from book chapter 6.1.1 and README; toy numbers from the repository test data.</text>
</svg>
