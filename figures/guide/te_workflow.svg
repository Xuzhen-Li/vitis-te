<rect x="0" y="0" width="1320" height="470" fill="#FFFFFF"/>
<text x="20.0" y="36.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="start">Default route: EDTA, TEtrimmer, TEsorter, a CDS-gated trusted library, soft-masking; panEDTA for a panel (README, Practical workflow)</text>
<rect x="20.0" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#g1F72AE)" stroke="#1F72AE" stroke-width="1.4" filter="url(#shadow)"/>
<text x="30.0" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1F72AE" text-anchor="start">EDTA per haplotype</text>
<text x="30.0" y="122.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">--species others --sensitive 1</text>
<text x="30.0" y="137.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">--anno 1</text>
<text x="30.0" y="152.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">set --u and record its source</text>
<circle cx="173.4" cy="68.0" r="11" fill="#1F72AE"/>
<text x="173.4" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="205.4" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#gF77E12)" stroke="#F77E12" stroke-width="1.4" filter="url(#shadow)"/>
<text x="215.4" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#F77E12" text-anchor="start">TEtrimmer per</text>
<text x="215.4" y="110.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#F77E12" text-anchor="start">haplotype</text>
<text x="215.4" y="139.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">keep Perfect + Good</text>
<text x="215.4" y="154.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">CD-HIT about 95% identity</text>
<circle cx="358.9" cy="68.0" r="11" fill="#F77E12"/>
<text x="358.9" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="390.9" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#g595594)" stroke="#595594" stroke-width="1.4" filter="url(#shadow)"/>
<text x="400.9" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#595594" text-anchor="start">TEsorter (rexdb-plant)</text>
<text x="400.9" y="122.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">domains and labels only</text>
<text x="400.9" y="137.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">never swap in all.cls.lib</text>
<circle cx="544.3" cy="68.0" r="11" fill="#595594"/>
<text x="544.3" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="576.3" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#g119B76)" stroke="#119B76" stroke-width="1.4" filter="url(#shadow)"/>
<text x="586.3" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#119B76" text-anchor="start">Curation gate</text>
<text x="586.3" y="122.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">CDS BLAST removes host</text>
<text x="586.3" y="137.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">genes</text>
<text x="586.3" y="152.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">TEsorter class-emit rules;</text>
<text x="586.3" y="167.7" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">record sha256</text>
<circle cx="729.7" cy="68.0" r="11" fill="#119B76"/>
<text x="729.7" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="761.7" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#g1D7CBB)" stroke="#1D7CBB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="771.7" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1D7CBB" text-anchor="start">Soft-mask /</text>
<text x="771.7" y="110.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1D7CBB" text-anchor="start">--curatedlib</text>
<text x="771.7" y="139.2" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">RepeatMasker -xsmall or</text>
<text x="771.7" y="154.4" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">EDTA --curatedlib</text>
<text x="771.7" y="169.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">trusted file only</text>
<circle cx="915.1" cy="68.0" r="11" fill="#1D7CBB"/>
<text x="915.1" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="947.1" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#g8A4C38)" stroke="#8A4C38" stroke-width="1.4" filter="url(#shadow)"/>
<text x="957.1" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#8A4C38" text-anchor="start">panEDTA for a panel</text>
<text x="957.1" y="122.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">combine panel results</text>
<text x="957.1" y="137.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">formally</text>
<text x="957.1" y="152.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">then re-annotate the panel</text>
<circle cx="1100.6" cy="68.0" r="11" fill="#8A4C38"/>
<text x="1100.6" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="1132.6" y="70.0" width="167.4" height="132.0" rx="8" fill="url(#gA8127F)" stroke="#A8127F" stroke-width="1.4" filter="url(#shadow)"/>
<text x="1142.6" y="92.9" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#A8127F" text-anchor="start">Downstream</text>
<text x="1142.6" y="122.1" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">LTR age, LAI, PAV</text>
<text x="1142.6" y="137.3" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">only after curated pan TE</text>
<text x="1142.6" y="152.5" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">GFFs exist</text>
<circle cx="1286.0" cy="68.0" r="11" fill="#A8127F"/>
<text x="1286.0" y="72.6" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<polyline points="188.4,120.0 202.4,120.0" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" marker-end="url(#m333333)"/>
<polyline points="373.9,120.0 387.9,120.0" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" marker-end="url(#m333333)"/>
<polyline points="559.3,120.0 573.3,120.0" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" marker-end="url(#m333333)"/>
<polyline points="744.7,120.0 758.7,120.0" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" marker-end="url(#m333333)"/>
<polyline points="930.1,120.0 944.1,120.0" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" marker-end="url(#m333333)"/>
<polyline points="1115.6,120.0 1129.6,120.0" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" marker-end="url(#m333333)"/>
<text x="20.0" y="226.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="start">Which product may be used as --curatedlib or for gene soft-masking (README product table)</text>
<rect x="20.0" y="236.0" width="246.4" height="92.0" rx="8" fill="url(#gCC312C)" stroke="#CC312C" stroke-width="1.4" filter="url(#shadow)"/>
<text x="32.0" y="258.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CC312C" text-anchor="start">Usable: no</text>
<text x="32.0" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">Raw EDTA TElib</text>
<text x="32.0" y="294.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">not a trusted library; not --curatedlib</text>
<rect x="278.4" y="236.0" width="246.4" height="92.0" rx="8" fill="url(#gCC312C)" stroke="#CC312C" stroke-width="1.4" filter="url(#shadow)"/>
<text x="290.4" y="258.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CC312C" text-anchor="start">Usable: no</text>
<text x="290.4" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">Working library (after TEtrimmer +</text>
<text x="290.4" y="294.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">CD-HIT)</text>
<text x="290.4" y="310.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">whole file is not a trusted library</text>
<rect x="536.8" y="236.0" width="246.4" height="92.0" rx="8" fill="url(#g119B76)" stroke="#119B76" stroke-width="1.4" filter="url(#shadow)"/>
<text x="548.8" y="258.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#119B76" text-anchor="start">Usable: yes</text>
<text x="548.8" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">Trusted gated library</text>
<text x="548.8" y="294.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">the only file for --curatedlib and gene</text>
<text x="548.8" y="309.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">soft-masking</text>
<rect x="795.2" y="236.0" width="246.4" height="92.0" rx="8" fill="url(#gCC312C)" stroke="#CC312C" stroke-width="1.4" filter="url(#shadow)"/>
<text x="807.2" y="258.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CC312C" text-anchor="start">Usable: no</text>
<text x="807.2" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">cat + CD-HIT of many libraries</text>
<text x="807.2" y="294.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">deduplication is not curation</text>
<rect x="1053.6" y="236.0" width="246.4" height="92.0" rx="8" fill="url(#gCC312C)" stroke="#CC312C" stroke-width="1.4" filter="url(#shadow)"/>
<text x="1065.6" y="258.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#CC312C" text-anchor="start">Usable: no</text>
<text x="1065.6" y="278.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">Non-TE repeats (TRF, telomeres,</text>
<text x="1065.6" y="294.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#000000" text-anchor="start">rDNA)</text>
<text x="1065.6" y="310.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">do not belong in --curatedlib</text>
<rect x="20.0" y="356.0" width="1280.0" height="72.0" rx="8" fill="#F7F7F7" stroke="#6B6B6B" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="34.0" y="384.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#333333" text-anchor="start">If --u is omitted, EDTA silently uses a rice rate of 1.3e-8 per bp per year; never use it for grape without saying so.</text>
<text x="34.0" y="406.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#333333" text-anchor="start">Soft-mask only: do not hard-mask for BRAKER or GALBA. Classifier-only tools name consensi; they do not replace trimmers or become the library.</text>
<text x="1300.0" y="460.0" font-family="Arial, Liberation Sans, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B6B6B" text-anchor="end">Steps, options and rules quoted from README, Practical workflow.</text>
</svg>
