<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-label="Mainstream plant TE library route">
<title>Mainstream plant TE library route</title>
<rect width="820" height="290" fill="#ffffff"/>
<text x="20" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111">F8. One mainstream plant library route (recommended here, not the only route)</text>
<rect x="30" y="70" width="130" height="48" rx="2" fill="#e8f1fa" stroke="#222" stroke-width="1"/>
<text x="95" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">EDTA de novo</text>
<line x1="160" y1="94" x2="170" y2="94" stroke="#333" stroke-width="1.5"/>
<rect x="170" y="70" width="130" height="48" rx="2" fill="#e8f1fa" stroke="#222" stroke-width="1"/>
<text x="235" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">TEtrimmer</text>
<line x1="300" y1="94" x2="310" y2="94" stroke="#333" stroke-width="1.5"/>
<rect x="310" y="70" width="130" height="48" rx="2" fill="#e8f1fa" stroke="#222" stroke-width="1"/>
<text x="375" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">TEsorter labels</text>
<line x1="440" y1="94" x2="470" y2="94" stroke="#333" stroke-width="1.5"/>
<rect x="470" y="70" width="130" height="48" rx="2" fill="#e8f1fa" stroke="#222" stroke-width="1"/>
<text x="535" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">CDS-gated trusted</text>
<line x1="600" y1="94" x2="640" y2="94" stroke="#333" stroke-width="1.5"/>
<rect x="640" y="70" width="130" height="48" rx="2" fill="#e8f1fa" stroke="#222" stroke-width="1"/>
<text x="705" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">soft-mask / panEDTA</text>
<text x="30" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Raw EDTA TElib is not a trusted library and is not --curatedlib.</text>
<text x="30" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">TEsorter (e.g. rexdb-plant) names domains; do not replace the working FASTA with all.cls.lib.</text>
<text x="30" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Soft-mask only (RepeatMasker -xsmall) for gene annotation. Hard-masking hides real genes.</text>
<text x="30" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">panEDTA (Ou et al. 2024 maize pangenome paper, doi:10.1101/gr.278131.123) merges a panel; do not cat raw libraries.</text>
<text x="30" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Peer pipelines exist: RepeatModeler2, Earl Grey, HiTE, DANTE/DANTE_LTR for lineage-centric LTR work. See the tools chapter.</text>
<text x="30" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">R1 trusted ~240 is an archive/teaching example, not a universal target number.</text>
</svg>
