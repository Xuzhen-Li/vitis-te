<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="TIR DNA transposon versus MITE">
<title>TIR DNA transposon versus MITE</title>
<rect width="1100" height="320" fill="#ffffff"/>
<text x="20" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111">F4. TIR DNA transposon versus a MITE</text>
<text x="40" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111">Autonomous TIR element: TIR — transposase (DDE or variant) — TIR. Cut-and-paste. TSD length is superfamily-typical [待确认].</text>
<text x="40" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111"></text>
<rect x="40" y="75" width="80" height="28" rx="2" fill="#f4c27a" stroke="#222" stroke-width="1"/>
<text x="80.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">TIR</text>
<rect x="120" y="75" width="260" height="28" rx="2" fill="#8fbf7f" stroke="#222" stroke-width="1"/>
<text x="250.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">transposase and other ORFs</text>
<rect x="380" y="75" width="80" height="28" rx="2" fill="#f4c27a" stroke="#222" stroke-width="1"/>
<text x="420.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">TIR</text>
<text x="40" y="140" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111">MITE: short TIR element with little or no transposase ORF. Needs an autonomous partner that shares termini.</text>
<text x="40" y="147" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111"></text>
<rect x="40" y="155" width="80" height="28" rx="2" fill="#f4c27a" stroke="#222" stroke-width="1"/>
<text x="80.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">TIR</text>
<rect x="120" y="155" width="80" height="28" rx="2" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
<text x="160.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">short</text>
<rect x="200" y="155" width="80" height="28" rx="2" fill="#f4c27a" stroke="#222" stroke-width="1"/>
<text x="240.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">TIR</text>
<text x="40" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">TSD lengths previously taken from Wicker 2007 Fig. 1 [待确认]: Tc1-Mariner TA; hAT 8 bp; Mutator 9-11 bp; Merlin 8-9 bp; Transib 5 bp; P 8 bp; PiggyBac TTAA; PIF-Harbinger 3 bp; CACTA 2-3 bp.</text>
<text x="40" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Tourist MITEs are related to PIF (Zhang et al. 2001). Stowaway MITEs are plant Mariner elements with a TA TSD (Wicker 2007 body, [待确认]). Keep them as their own families.</text>
<text x="40" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Do not merge non-autonomous copies into the autonomous consensus sequence. Assign them to a superfamily by shared termini or homology (this repository teaching practice [待确认]).</text>
<text x="40" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Structural tools (TIR-Learner, MITE-Hunter, detectMITE, GRF) look for TIR + TSD. Homology tools need a library that already contains the family.</text>
</svg>
