<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="LINE versus SINE anatomy">
<title>LINE versus SINE anatomy</title>
<rect width="1100" height="320" fill="#ffffff"/>
<text x="20" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#111">F3. LINE (autonomous non-LTR) versus SINE (non-autonomous)</text>
<text x="40" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111">LINE (e.g. L1-like): 5' UTR — ORF1 — ORF2 (EN + RT) — 3' UTR / poly(A) [待确认]. Often 5'-truncated in the genome (Wells 2020).</text>
<text x="40" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111"></text>
<rect x="40" y="75" width="70" height="28" rx="2" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
<text x="75.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">5'</text>
<rect x="110" y="75" width="110" height="28" rx="2" fill="#8fbf7f" stroke="#222" stroke-width="1"/>
<text x="165.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">ORF1</text>
<rect x="220" y="75" width="80" height="28" rx="2" fill="#f2b5b5" stroke="#222" stroke-width="1"/>
<text x="260.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">EN</text>
<rect x="300" y="75" width="110" height="28" rx="2" fill="#6ea8d8" stroke="#222" stroke-width="1"/>
<text x="355.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">RT (ORF2)</text>
<rect x="410" y="75" width="80" height="28" rx="2" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
<text x="450.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">3'/A [待确认]</text>
<text x="40" y="140" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#111">SINE: short, no RT of its own. Usually derived from tRNA, 7SL or 5S RNA and trans-mobilized by LINE machinery (Wells 2020).</text>
<text x="40" y="147" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111"></text>
<rect x="40" y="155" width="90" height="28" rx="2" fill="#f7e3a0" stroke="#222" stroke-width="1"/>
<text x="85.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">tRNA/7SL/5S-like</text>
<rect x="130" y="155" width="100" height="28" rx="2" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
<text x="180.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">body</text>
<rect x="230" y="155" width="90" height="28" rx="2" fill="#f4c27a" stroke="#222" stroke-width="1"/>
<text x="275.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">3'</text>
<text x="40" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Wells 2020: ORF2 encodes EN and RT; TPRT often terminates early, leaving 5-prime-truncated copies.</text>
<text x="40" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Wells 2020: most SINEs derive from tRNA, 7SL or 5S RNA and are trans-mobilized by LINE machinery.</text>
<text x="40" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Wells 2020: a hallmark of TPRT is frequent 5-prime truncation. The 3' UTR / poly(A) label and a variable TSD are [待确认]; they are not in the opened Wells 2020 full text.</text>
<text x="40" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">Plant genomes have LINEs and SINEs. A grape-specific claim that LTR elements dominate assembled sequence is not taught here (it was not in the opened Jaillon or Velasco abstracts). Exact Vitis lineage lists are [待确认] until a cited annotation is opened.</text>
</svg>
